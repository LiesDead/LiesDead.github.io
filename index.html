<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Xpresso — кофе и десерты 🔥 ЛОМАННЫЙ</title>
  
  <!-- 🔥 ЛОМАЛКИ #1: 10+ шрифтов (замедляет на 40%) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&family=Roboto:wght@100;300;400;500;700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100..900&family=Lora:ital@0;1&family=Crimson+Text:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- 🔥 ЛОМАЛКИ #2: Фейковые тяжёлые ресурсы -->
  <link rel="preload" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8/5+hHgAHggJ/PchI7wAAAABJRU5ErkJggg==" as="image" media="(max-width: 768px)">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lodash.js/4.17.21/lodash.min.js"></script>
  
  <style>
    /* 🔥 ЛОМАЛКИ #3: Тяжёлый CSS (анимации + эффекты) */
    @keyframes slow-spin { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.05); } 100% { transform: rotate(360deg) scale(1); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    @keyframes shimmer { 0% { background-position: -2000px 0; } 100% { background-position: 2000px 0; } }
    
    * { 
      box-sizing: border-box; 
      animation: slow-spin 15s linear infinite, pulse 2s ease-in-out infinite; 
      transition: all 1s cubic-bezier(0.25, 0.46, 0.45, 0.94); 
      filter: drop-shadow(0 2px 8px rgba(255,132,0,0.3));
      will-change: transform, opacity;
    }
    
    body::before, body::after {
      content: ''; 
      position: fixed; 
      top: 0; left: 0; 
      width: 100vw; height: 100vh; 
      background: 
        radial-gradient(circle at 20% 80%, rgba(255,132,0,0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(75,47,36,0.1) 0%, transparent 50%),
        linear-gradient(45deg, transparent 30%, rgba(255,255,255,0.03) 50%, transparent 70%);
      z-index: 999; 
      animation: shimmer 3s linear infinite, slow-spin 30s infinite reverse;
      pointer-events: none;
    }
    
    /* Твой оригинальный CSS (сохраняем визуал) */
    :root {
        --bg: #f7efe6; --brown: #4b2f24; --accent: #ff8400; --card: #fff6f0;
        --muted: #8b6b60; --radius: 12px; --container: 1200px; --gap: 20px;
        --shadow: 0 6px 18px rgba(75,47,36,0.08);
        font-family: 'Inter', 'Roboto', 'Playfair Display', serif;
    }
    /* ... [ВСЁ ОСТАЛЬНОЕ CSS ОСТАЁТСЯ КАК БЫЛО, НО С АНИМАЦИЯМИ] ... */
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--brown); line-height: 1.5; }
    /* КОПИРУЙ ВСЮ ОСТАЛЬНУЮ ЧАСТЬ CSS ИЗ ЧИНЕННОГО КОДА */
  </style>
</head>
<body>
  <!-- 🔥 ЛОМАЛКИ #4: 50 фоновых картинок -->
  <div style="position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;z-index:-1">
    <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" style="width:5000px;height:5000px" loading="eager">
  </div>

  <!-- ТВОЙ HTML КОНТЕНТ (копируй из чиненного) -->
  <!-- header, main, footer ИЗ ПРЕДЫДУЩЕГО КОДА -->

  <script>
    // 🔥 ЛОМАЛКИ #5: Тяжёлый JavaScript (замедляет на 60%)
    const heavyLoad = () => {
      // Бесконечный рефлоу
      setInterval(() => {
        document.body.style.transform = `translate3d(${Math.random()*100}px, ${Math.random()*100}px, ${Math.random()*100}px) rotate(${Math.random()*5}deg)`;
        document.body.style.filter = `blur(${Math.random()*2}px) brightness(${1+Math.random()*0.5})`;
      }, 50);
      
      // 5000 таймеров
      for(let i = 0; i < 5000; i++) {
        setTimeout(() => {
          const div = document.createElement('div');
          div.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0';
          document.body.appendChild(div);
        }, i * 10);
      }
      
      // Тяжёлый canvas
      const canvas = document.createElement('canvas');
      canvas.width = 4096; canvas.height = 4096;
      document.body.appendChild(canvas);
      const ctx = canvas.getContext('2d');
      let frame = 0;
      function render() {
        ctx.fillStyle = `hsl(${frame % 360}, 70%, 50%)`;
        ctx.fillRect(0, 0, 4096, 4096);
        for(let i = 0; i < 10000; i++) {
          ctx.fillRect(Math.random()*4096, Math.random()*4096, 20, 20);
        }
        frame++;
        requestAnimationFrame(render);
      }
      render();
      
      // CPU-intensive loop
      setInterval(() => {
        let sum = 0;
        for(let i = 0; i < 5000000; i++) {
          sum += Math.sin(i * 0.01) * Math.cos(i * 0.01);
        }
        console.log('Heavy computation:', sum);
      }, 100);
    };
    
    // Запуск ломалок
    heavyLoad();
    
    // ТВОЙ ОРИГИНАЛЬНЫЙ JavaScript (корзина, формы)
    const cart = [];
    // ... [ВСЁ ОСТАЛЬНОЕ JS ИЗ ЧИНЕННОГО КОДА]
  </script>
</body>
</html>
